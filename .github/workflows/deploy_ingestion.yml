name: Deploy ingestion to dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ingestion-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 411145869013.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: population-ingestion
  LAMBDA_FUNCTION: population-ingestion-dev
  IMAGE_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:

  run_ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: run_ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
        # Check out source to have the runner download the repository
        # so that it can access the code and build the Docker image.
      - name: Check out source
        uses: actions/checkout@v6
        
        # Set up Docker Buildx to build and push the Docker image to ECR
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
        # authenticate then Log in to Amazon ECR so that the runner can push 
        # the Docker image to the repository.
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        
      - name: Log Docker into ECR
        run: |
          aws ecr get-login-password |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
        
        # Build and push the Docker image to ECR, 
        # and then update the Lambda function to use the new image.
      - name: Build and upload image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./ingestion

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION"